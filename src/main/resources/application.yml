spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:trading;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[format_sql]": true
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.security.supabase.issuer-uri}
          jwk-set-uri: ${app.security.supabase.jwk-set-uri}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    "[com.neueda.leap]": INFO

app:
  security:
    supabase:
      issuer-uri: ${SUPABASE_ISSUER_URI:https://YOUR-PROJECT-REF.supabase.co/auth/v1}
      jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://YOUR-PROJECT-REF.supabase.co/auth/v1/.well-known/jwks.json}
      audience: ${SUPABASE_AUDIENCE:authenticated}

market-data:
  fauxnance:
    base-url: ${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
    api-key: ${FAUXNANCE_API_KEY:}
    use-order-price-fallback: ${FAUXNANCE_USE_ORDER_PRICE_FALLBACK:true}
