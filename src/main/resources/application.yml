spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:trading;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

olap:
  datasource:
    url: ${OLAP_DB_URL:jdbc:h2:mem:trading_olap;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${OLAP_DB_USER:sa}
    password: ${OLAP_DB_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

logging:
  level:
    com.neueda.leap: INFO

market-data:
  fauxnance:
    base-url: ${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
    api-key: ${FAUXNANCE_API_KEY:}
    use-order-price-fallback: ${FAUXNANCE_USE_ORDER_PRICE_FALLBACK:true}
