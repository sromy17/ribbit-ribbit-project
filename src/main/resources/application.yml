spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:trading;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

olap:
  enabled: ${ETL_ENABLED:false}
  datasource:
    url: ${DB_OLAP_URL:jdbc:postgresql://localhost:5432/ribbit_olap}
    username: ${DB_OLAP_USER:${DB_USER:}}
    password: ${DB_OLAP_PASSWORD:${DB_PASSWORD:}}
  source:
    url: ${DB_OLTP_URL:${DB_URL:jdbc:postgresql://localhost:5432/ribbit_oltp}}
    username: ${DB_OLTP_USER:${DB_USER:}}
    password: ${DB_OLTP_PASSWORD:${DB_PASSWORD:}}
  etl:
    fixed-delay-ms: ${ETL_FIXED_DELAY_MS:300000}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.neueda.leap: INFO

security:
  jwt:
    shared-secret: ${JWT_SHARED_SECRET:${JWT_SECRET:please-change-this-jwt-secret-to-at-least-32-chars}}

market-data:
  fauxnance:
    base-url: ${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
    api-key: ${FAUXNANCE_API_KEY:}
    use-order-price-fallback: ${FAUXNANCE_USE_ORDER_PRICE_FALLBACK:true}
