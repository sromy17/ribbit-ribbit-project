<main class="flex min-h-dvh flex-col bg-canvas px-6 py-8 text-ink">
  <header class="mx-auto w-full max-w-6xl"><app-brand /></header>
  <div class="mx-auto flex w-full max-w-md flex-1 items-center py-12">
    <section class="w-full" aria-labelledby="sign-in-title">
      <ng-container *ngIf="!signInType; else credentials">
        <h1 id="sign-in-title" class="text-3xl font-semibold tracking-tight">Sign in</h1>
        <p class="mt-3 text-sm text-muted">Choose your account.</p>
        <div class="mt-8 grid gap-4">
          <button type="button" class="group flex w-full items-center justify-between rounded-xl border border-line bg-panel p-6 text-left transition hover:border-brand focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand" (click)="chooseSignIn('user')">
            <span><strong class="block text-base font-semibold">User sign-in</strong><span class="mt-1 block text-sm text-muted">Accounts and trading</span></span>
            <span class="text-brand" aria-hidden="true">→</span>
          </button>
          <button type="button" class="group flex w-full items-center justify-between rounded-xl border border-line bg-panel p-6 text-left transition hover:border-brand focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brand" (click)="chooseSignIn('staff')">
            <span><strong class="block text-base font-semibold">Staff sign-in</strong><span class="mt-1 block text-sm text-muted">Administration and analytics</span></span>
            <span class="text-brand" aria-hidden="true">→</span>
          </button>
        </div>
      </ng-container>
      <ng-template #credentials>
        <button uiButton="ghost" type="button" class="mb-6" (click)="chooseSignIn(null)" [disabled]="loading">← Back</button>
        <h1 id="sign-in-title" class="text-3xl font-semibold tracking-tight">{{ staffLogin ? 'Staff sign-in' : 'User sign-in' }}</h1>
        <form class="mt-8 grid gap-5" (ngSubmit)="login()" novalidate>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input uiInput id="login-username" type="text" [(ngModel)]="username" name="username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input uiInput id="login-password" type="password" [(ngModel)]="password" name="password" autocomplete="current-password" required />
          </div>
          <div *ngIf="error" class="error" role="alert">{{ error }}</div>
          <button uiButton="primary" type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button>
        </form>
        <button *ngIf="!staffLogin" uiButton="ghost" type="button" class="mt-5 w-full" (click)="router.navigate(['/register'])">Create an account</button>
      </ng-template>
    </section>
  </div>
</main>
