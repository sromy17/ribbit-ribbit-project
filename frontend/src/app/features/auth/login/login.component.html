<div class="login-container">
  <div class="login-box">
    <h1>RibbitRibbit</h1>
    <p class="subtitle">Investor Dashboard</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Username/Email</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username"
          placeholder="investor@test.com"
          required 
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="password"
          required 
        />
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="test-credentials">
      <p><strong>Test Credentials:</strong></p>
      <p>Investor: investor@test.com / password</p>
      <p>Admin: admin@test.com / password</p>
      <p>Analyst: analyst@test.com / password</p>
    </div>
  </div>
</div>
