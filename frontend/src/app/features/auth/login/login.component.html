<div class="login-container">
  <div class="login-box">
    <div class="brand-lockup" aria-label="Leap Trader Pro">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leap Trader <strong>Pro</strong></span>
    </div>
    <p class="subtitle">Institutional trading workspace</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Username/Email</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username"
          placeholder="investor@test.com"
          required 
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="password"
          required 
        />
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

      <button type="button" class="btn-secondary" (click)="router.navigate(['/register'])">
        Create a user profile
      </button>
    </form>

    <div class="test-credentials">
      <p><strong>Test Credentials:</strong></p>
      <p>Investor: investor@test.com / password</p>
      <p>Admin: admin@test.com / password</p>
      <p>Analyst: analyst@test.com / password</p>
    </div>
  </div>
</div>
