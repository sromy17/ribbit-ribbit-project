<div class="login-container">
  <div class="login-box">
    <div class="brand-lockup" aria-label="Leap Trader Pro">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leap Trader <strong>Pro</strong></span>
    </div>
    <p class="subtitle">{{ employeeLogin ? 'Employee sign in' : 'Institutional trading workspace' }}</p>
    <p *ngIf="employeeLogin">Admin and analyst access only. Employee accounts are provisioned by your administrator.</p>

    <form (ngSubmit)="login()" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username"
          autocomplete="username"
          [(ngModel)]="username" 
          name="username"
          [placeholder]="employeeLogin ? 'Employee username' : 'investor@test.com'"
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password"
          autocomplete="current-password"
          [(ngModel)]="password" 
          name="password"
          placeholder="password"
          required 
        />
      </div>

      <div *ngIf="error" class="error" aria-live="assertive">{{ error }}</div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

      <button *ngIf="!employeeLogin" type="button" class="btn-secondary" (click)="router.navigate(['/register'])">
        Create a user profile
      </button>
      <button type="button" class="btn-secondary" (click)="router.navigate([employeeLogin ? '/login' : '/employee-login'])">
        {{ employeeLogin ? 'Investor sign in' : 'Employee sign in' }}
      </button>
    </form>

  </div>
</div>
