<div class="login-container">
  <div class="login-box">
    <div class="brand-lockup" aria-label="Leap Trader Pro">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leap Trader <strong>Pro</strong></span>
    </div>
    <p class="subtitle">Create your user profile</p>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" [(ngModel)]="firstName" name="firstName" required autocomplete="given-name" />
      </div>

      <div class="form-group">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" [(ngModel)]="lastName" name="lastName" required autocomplete="family-name" />
      </div>

      <div class="form-group">
        <label for="username">Username (email address)</label>
        <input id="username" type="email" [(ngModel)]="username" name="username" required email autocomplete="username" placeholder="you@example.com" #usernameField="ngModel" />
        <span *ngIf="usernameField.touched && usernameField.errors?.['email']" class="error" role="alert">Username must be a valid email address</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required minlength="12" autocomplete="new-password" />
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <div class="password-requirement-slot">
        <p *ngIf="password.length < 12" class="password-requirement" aria-live="polite">
          Password must be 12 characters long
        </p>
      </div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Creating...' : 'Create profile' }}
      </button>
    </form>

    <button type="button" class="btn-secondary" (click)="router.navigate(['/login'])">
      Back to sign in
    </button>
  </div>
</div>
