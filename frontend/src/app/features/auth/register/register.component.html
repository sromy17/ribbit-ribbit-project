<div class="login-container">
  <div class="login-box">
    <div class="brand-lockup" aria-label="Leap Trader Pro">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leap Trader <strong>Pro</strong></span>
    </div>
    <p class="subtitle">Create your user profile</p>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="new-password" />
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Creating...' : 'Create profile' }}
      </button>
    </form>

    <button type="button" class="btn-secondary" (click)="router.navigate(['/login'])">
      Back to sign in
    </button>
  </div>
</div>
