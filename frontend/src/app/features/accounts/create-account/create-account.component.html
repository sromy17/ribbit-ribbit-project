<div class="page-container">
  <div class="form-card">
    <div class="tw:mb-4 tw:flex tw:justify-end"><app-theme-toggle /></div>
    <div class="brand-lockup" aria-label="Leap Trader Pro">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leap Trader <strong>Pro</strong></span>
    </div>
    <p class="subtitle">Create a trading account</p>

    <form (ngSubmit)="createAccount()">
      <div class="form-group">
        <label for="accountType">Account type</label>
        <select id="accountType" [(ngModel)]="accountType" name="accountType" required>
          <option *ngFor="let type of accountTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Create account' }}
      </button>
    </form>

    <button type="button" class="btn-secondary" (click)="router.navigate(['/accounts'])">
      Back to home
    </button>
  </div>
</div>
