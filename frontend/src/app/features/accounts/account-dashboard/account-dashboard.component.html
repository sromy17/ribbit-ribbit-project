<header class="header">
  <div class="header-content">
    <div class="brand-lockup" aria-label="Leap Trader Pro">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leap Trader <strong>Pro</strong></span>
    </div>
    <div class="header-actions">
      <span class="user-badge">{{ currentUser?.username }}</span>
      <button type="button" (click)="logout()" class="btn-logout">Logout</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-heading">
    <div>
      <!-- <p class="eyebrow">Accounts</p> -->
      <h1>Your Accounts</h1>
      <p class="description">Select an account to open its trading view.</p>
    </div>
    <button type="button" class="btn-primary btn-icon" (click)="createAccount()" aria-label="Create a new account" title="Create a new account">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <div *ngIf="error" class="error-banner">{{ error }}</div>

  <div *ngIf="loading" class="loading-indicator">Loading accounts...</div>

  <div *ngIf="!loading && accounts.length === 0" class="empty-state">
    <p>You do not have any accounts yet.</p>
    <button type="button" class="btn-primary" (click)="createAccount()">Create your first account</button>
  </div>

  <ul *ngIf="!loading && accounts.length > 0" class="account-list">
    <li *ngFor="let account of accounts">
      <button type="button" class="account-row" (click)="openAccount(account)">
        <span class="account-type">{{ formatAccountType(account.type) }}</span>
        <span class="account-id">ID: {{ account.accountId }}</span>
      </button>
    </li>
  </ul>
</main>
