<app-workspace area="Accounts" [username]="currentUser?.username || ''" (logout)="logout()">
  <div class="page-body">
    <app-page-heading
      eyebrow="Your workspace"
      title="Your accounts"
      description="Everything you trade, in one place. Choose an account to get started."
    >
      <button uiButton="primary" type="button" (click)="createAccount()">
        <span aria-hidden="true">＋</span> New account
      </button>
    </app-page-heading>
    <div *ngIf="error" class="error-banner">{{ error }}</div>

    <div *ngIf="loading" class="loading-indicator">Loading accounts...</div>

    <div *ngIf="!loading && accounts.length === 0" class="empty-state">
      <p>You do not have any accounts yet.</p>
      <button uiButton="primary" type="button" class="btn-primary" (click)="createAccount()">
        Create your first account
      </button>
    </div>

    <ul *ngIf="!loading && accounts.length > 0" class="account-list">
      <li *ngFor="let account of accounts">
        <button type="button" class="account-row" (click)="openAccount(account)">
          <span class="account-row-icon" aria-hidden="true"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <rect x="3" y="5" width="18" height="15" rx="3" />
              <path d="M3 10h18M7 15h4" /></svg
          ></span>
          <span class="account-type">{{ formatAccountType(account.type) }}</span>
          <span class="account-id">Account #{{ account.accountId }}</span
          ><span class="account-row-footer"
            >Open trading workspace <span aria-hidden="true">→</span></span
          >
        </button>
      </li>
    </ul>
  </div>
</app-workspace>
