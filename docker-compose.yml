services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ribbit-oltp}
      POSTGRES_OLAP_DB: ${POSTGRES_OLAP_DB:-ribbit-olap}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./basedSchema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/init-olap.sql:/docker-entrypoint-initdb.d/03-olap-database.sql:ro
      - ./olap.sql:/opt/ribbit/olap.sql:ro

      - postgres_data:/var/lib/postgresql/data
    networks:
      - ribbit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: deploy/init.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ribbit-oltp}
      POSTGRES_OLAP_DB: ${POSTGRES_OLAP_DB:-ribbit-olap}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - ribbit-network
    restart: "no"

  springboot:
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ribbit-oltp}
      DB_OLTP_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ribbit-oltp}
      DB_OLTP_USER: ${POSTGRES_USER:-postgres}
      DB_OLTP_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_OLAP_URL: jdbc:postgresql://postgres:5432/${POSTGRES_OLAP_DB:-ribbit-olap}
      DB_OLAP_USER: ${POSTGRES_USER:-postgres}
      DB_OLAP_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ORDER_EXECUTION_KAFKA_ENABLED: "false"
      ETL_ENABLED: ${ETL_ENABLED:-true}
      ETL_FIXED_DELAY_MS: ${ETL_FIXED_DELAY_MS:-300000}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:?Set JWT_SHARED_SECRET to at least 32 characters in .env}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      MARKET_DATA_KAFKA_ENABLED: "false"
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-}
      FAUXNANCE_DAILY_REQUEST_LIMIT: ${FAUXNANCE_DAILY_REQUEST_LIMIT:-1000}
      FAUXNANCE_BUDGET_FILE: /app/state/fauxnance-budget.properties
      MARKET_DATA_DISPLAY_CACHE_MS: ${MARKET_DATA_DISPLAY_CACHE_MS:-3600000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_SHUTDOWN: graceful
    volumes:
      - quote_state:/app/state
    networks:
      - ribbit-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  auth:
    restart: unless-stopped
    init: true
    build:
      context: ./shared/auth-stub
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      springboot:
        condition: service_healthy
    environment:
      AUTH_STUB_PORT: 4000
      DB_URL: postgresql://postgres:5432/${POSTGRES_DB:-ribbit-oltp}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_SSL: "false"
      JWT_SHARED_SECRET: ${JWT_SHARED_SECRET:?Set JWT_SHARED_SECRET to at least 32 characters in .env}
    networks:
      - ribbit-network

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    depends_on:
      springboot:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-4200}:80"
    networks:
      - ribbit-network

volumes:
  postgres_data:
  quote_state:

networks:
  ribbit-network:
    driver: bridge
